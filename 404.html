<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Página no encontrada · Mi Grado Sara Nicoll</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600&family=Montserrat:wght@400;500&display=swap" rel="stylesheet">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎓</text></svg>">
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(160deg, #2a0910, #4a1220 45%, #3d0f18);
      color: #efe3d3;
      font-family: 'Cormorant Garamond', serif;
      text-align: center;
      padding: 1.5rem;
      box-sizing: border-box;
    }
    .card {
      max-width: 450px;
      padding: 2.5rem 2rem;
      border: 1px solid rgba(201, 164, 92, 0.35);
      border-radius: 18px;
      background: rgba(255, 255, 255, 0.04);
      backdrop-filter: blur(10px);
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.4);
    }
    h1 {
      font-size: 3.5rem;
      color: #f1d9a4;
      margin: 0 0 0.5rem;
      font-weight: 600;
    }
    p {
      font-family: 'Montserrat', sans-serif;
      font-size: 0.95rem;
      color: #d9c4ad;
      margin: 0 0 1.8rem;
      line-height: 1.5;
    }
    .btn {
      display: inline-block;
      font-family: 'Montserrat', sans-serif;
      font-size: 0.9rem;
      font-weight: 500;
      text-decoration: none;
      color: #2a0910;
      background: linear-gradient(135deg, #c9a45c, #f1d9a4);
      padding: 0.8rem 1.8rem;
      border-radius: 999px;
      transition: opacity 0.2s, transform 0.2s;
    }
    .btn:hover {
      opacity: 0.9;
      transform: translateY(-2px);
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>404</h1>
    <p>La página que buscas no existe o ha sido movida.</p>
    <a href="/" class="btn">Volver a la Invitación ✨</a>
  </div>
</body>
</html>
